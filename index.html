<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 50px 20px;
    }

    .profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #1e293b;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      border: 3px solid #38bdf8;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .card h2 {
      margin-bottom: 12px;
    }

    .card p {
      color: #cbd5e1;
      line-height: 1.6;
    }

    .button {
      display: block;
      text-decoration: none;
      background: #38bdf8;
      color: #0f172a;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      transform: scale(1.03);
      background: #7dd3fc;
    }

    footer {
      margin-top: 30px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="profile">
      👤
    </div>

    <h1>Welcome to My Website</h1>

    <p class="subtitle">
      Personal Website
    </p>

    <div class="card">
      <h2>About Me</h2>
      <p>
        Hello! Welcome to my website.
        This is my personal space on the internet.
      </p>
    </div>

    <div class="card">
      <h2>My Links</h2>

      <a class="button" href="https://www.instagram.com/" target="_blank">
        Instagram
      </a>

      <a class="button" href="https://www.facebook.com/" target="_blank">
        Facebook
      </a>

      <a class="button" href="https://www.youtube.com/" target="_blank">
        YouTube
      </a>
    </div>

    <footer>
      © 2026 My Website
    </footer>

  </div>

</body>
</html>
